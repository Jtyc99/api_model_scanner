org.gradle.jvmargs=-Xmx2g
org.gradle.caching=true

# The Android Studio this plugin is built against. Any IntelliJ-platform IDE
# on the same branch (253 = 2025.3) will load it.
amscan.ideHome=/Applications/Android Studio.app/Contents

# The IntelliJ platform ships the Kotlin stdlib; bundling a second copy in
# the plugin risks a classloader conflict. `:report` asks for it explicitly,
# because it is a plain JVM module with no platform underneath it.
kotlin.stdlib.default.dependency=false
