name: api_model_scanner
description: >-
  A CLI that finds API model fields your Flutter/Dart app never uses, and
  removes them with AST-aware source edits.
version: 2.0.0
repository: https://github.com/JtycEdgeTech/api_model_scanner

environment:
  sdk: ^3.11.4

# Commands installed by `dart pub global activate`.
#
# NOTE: this package must NOT be added to a Flutter app's pubspec. It needs
# analyzer ^14, which requires meta ^1.18.3, while the Flutter SDK pins
# meta 1.17.0. Global activation resolves these dependencies in isolation,
# so the CLI works from inside any Flutter project.
executables:
  api_model_scanner: api_model_scanner
  amscan: api_model_scanner

# Add regular dependencies here.
dependencies:
  analyzer: ^14.1.0
  args: ^2.7.0
  path: ^1.9.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
